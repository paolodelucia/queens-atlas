[project]
name = "queens-atlas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["duckdb", "ijson", "pyarrow", "pandas", "anthropic"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "pipeline"]
addopts = "-ra"
markers = [
    "real_data: needs the local (gitignored) data/ or site/public/data files; skipped when they are missing",
]
